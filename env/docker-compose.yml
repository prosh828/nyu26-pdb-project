name: recco

# 레포 루트에서 실행: docker compose -f env/docker-compose.yml up -d --build
# 모든 값에 기본값이 있어서 .env 없이도 동작합니다.
# 바꾸고 싶은 값만 env/.env 에 적으면 덮어씁니다 (env/.env.example 참고, .env 는 선택).
# 아래 상대 경로는 이 파일이 있는 env/ 기준입니다.

x-db-env: &db-env
  MYSQL_DATABASE: ${MYSQL_DATABASE:-recco}
  MYSQL_USER: ${MYSQL_USER:-recco}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-reccopass}

services:
  db:
    image: mysql:8.0
    container_name: recco-db
    restart: unless-stopped
    environment:
      <<: *db-env
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --local-infile=1
    ports:
      - "${DB_HOST_PORT:-3307}:3306"   # 로컬 MySQL(3306)과 충돌 방지
    volumes:
      - db_data:/var/lib/mysql                       # 데이터 영구 저장
      - ../db/init:/docker-entrypoint-initdb.d:ro     # 최초 1회 실행되는 스키마/시드
      # MovieLens CSV. /var/lib/mysql-files 에 :ro 로 마운트하면 MySQL entrypoint 의 chown 이 실패해
      # 컨테이너가 죽으므로 /data 에 마운트하고 LOAD DATA LOCAL INFILE 로 읽습니다.
      - ../data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # 1회성 작업: MovieLens ml-latest-small 을 내려받아 DB 에 넣고 종료합니다.
  # 이미 넣었으면 바로 종료하고, LOAD_MOVIELENS=false 면 건너뜁니다 (샘플 데이터만).
  # 다시 실행: docker compose -f env/docker-compose.yml run --rm loader
  loader:
    build: ../app
    image: recco-app
    container_name: recco-loader
    restart: "no"
    command: ["flask", "import-movielens"]
    environment:
      <<: *db-env
      DB_HOST: db
      DB_PORT: 3306
      LOAD_MOVIELENS: ${LOAD_MOVIELENS:-true}
    volumes:
      - ../app:/app
      - ../db/import:/import:ro          # movielens.sql
      - ../data:/data:ro                 # 여기에 CSV 가 있으면 다운로드 대신 사용
      - movielens_cache:/cache           # 내려받은 CSV 보관 (host 폴더 권한 문제 없음)
    depends_on:
      db:
        condition: service_healthy

  # 1회성 작업: TMDB API 로 movies.poster_url (와 비어 있는 runtime) 을 채우고 종료합니다.
  # 앱은 기다리지 않습니다. TMDB_API_KEY 가 없으면 건너뛰고, 비어 있는 영화만 조회하므로
  # 중간에 멈춰도 다음 실행 때 이어서 합니다. 수동 실행: docker compose -f env/docker-compose.yml run --rm posters
  posters:
    build: ../app
    image: recco-app
    container_name: recco-posters
    restart: "no"
    command: ["flask", "fetch-posters"]
    environment:
      <<: *db-env
      DB_HOST: db
      DB_PORT: 3306
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    volumes:
      - ../app:/app
    depends_on:
      loader:
        condition: service_completed_successfully

  app:
    build: ../app
    image: recco-app
    container_name: recco-app
    restart: unless-stopped
    environment:
      <<: *db-env
      DB_HOST: db
      DB_PORT: 3306
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-dev-secret}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@recco.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
    ports:
      - "${APP_HOST_PORT:-5001}:5000"   # macOS AirPlay 수신 모드가 5000을 점유
    volumes:
      - ../app:/app        # 코드 수정 시 자동 리로드
      - ../data:/data:ro   # MovieLens CSV (앱에서 import 할 때 사용)
    depends_on:
      db:
        condition: service_healthy
      loader:
        condition: service_completed_successfully   # import 가 끝난 뒤에 앱 시작

  adminer:
    image: adminer:latest
    container_name: recco-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_HOST_PORT:-8081}:8080"
    depends_on:
      - db

volumes:
  db_data:
  movielens_cache:
